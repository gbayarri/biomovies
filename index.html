<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="refresh" content="0; url=https://mmb-irb.github.io/biomovies">
    <link rel="canonical" href="https://mmb-irb.github.io/biomovies">
    <title>Redirecting…</title>
    <script>
      const destination = "https://mmb-irb.github.io/biomovies";
      const suffix = window.location.pathname.replace(/^\/biomovies/, "");
      window.location.replace(destination + suffix + window.location.search + window.location.hash);
    </script>
  </head>
  <body>
    <p>This site has moved to <a href="https://mmb-irb.github.io/biomovies">mmb-irb.github.io/biomovies</a>.</p>
